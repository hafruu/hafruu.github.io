<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hafruu</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --border: #1e2630;
      --text: #e6edf3;
      --muted: #8b98a8;
      --accent: #e8c87a;
      --accent-hover: #f3d68a;
      --link: oklch(0.82 0.10 220);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px 40px;
      flex: 1;
      width: 100%;
    }
    header { margin-bottom: 48px; }
    h1 {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 48px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .card-list { display: grid; gap: 12px; }
    .card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::after {
      content: "→";
      font-size: 14px;
      opacity: 0.6;
      transition: transform 0.15s ease;
    }
    .card:hover .card-title::after { transform: translateX(4px); }
    .card-desc { color: var(--muted); font-size: 14px; }
    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--link); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>hafruu</h1>
      <p class="tagline">Notes, guides, and other things.</p>
    </header>

    <h2>Guides</h2>
    <div class="card-list">
      <a class="card" href="hydross.html">
        <div class="card-title">Hydross Resist Guide</div>
        <div class="card-desc">Tank briefing — frost and nature resist gear, positioning, phase timings.</div>
      </a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/hafruu/hafruu.github.io">source on github</a>
  </footer>
</body>
</html>
